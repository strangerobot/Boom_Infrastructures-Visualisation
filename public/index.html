<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="An interactive visualization of the generative AI infrastructure tech stack, showing how various tools, interfaces, models, and datasets connect in different workflows.">
  <title>Generative AI Infrastructure Tech Stack</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;700&family=IBM+Plex+Serif:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <!-- Visualisation wrapper that can go full screen -->
    <div id="visualisation-wrapper">
      
      <!-- Top Navbar with Title and Full Screen Action -->
      <div id="navbar" data-node-id="41:503" data-name="Navbar">
        <div id="navbar-left">
          <h1 id="diagram-title">Infrastructure Tech Stack</h1>
        </div>
        <button id="fullscreen-btn" aria-label="Toggle Full Screen" title="Toggle Full Screen" data-node-id="41:506">
          <div data-node-id="41:507" data-name="Full Screen">
            <img src="assets/fullscreen.png" alt="Full Screen Icon">
          </div>
        </button>
      </div>

      <!-- Tech Stack Canvas Container -->
      <div id="canvas-container" data-node-id="41:508">
        
        <!-- Workflow Selection Header -->
        <div id="workflow-section" data-node-id="41:516">
          <p id="workflow-label">Select a workflow to learn how this infra is used</p>
          <div id="workflow-select-wrapper" data-node-id="41:518">
            <div id="workflow-selected-option">
              <span id="workflow-selected-text">Select a workflow...</span>
              <div id="workflow-select-arrow">
                <svg width="12" height="8" viewBox="0 0 12 8" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path d="M1 1.5L6 6.5L11 1.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </div>
            </div>
            <div id="workflow-dropdown-list" class="hidden">
              <!-- Options populated dynamically -->
            </div>
          </div>
          <div id="workflow-backdrop" class="hidden"></div>
        </div>

        <!-- Scrollable stack canvas -->
        <div id="canvas" data-node-id="41:521">
          <!-- Static Core Infrastructure Header -->
          <div id="infra-header" data-node-id="41:522">
            <p id="infra-text">Core infrastructure (cloudflare, DNS) providers enable all these layers</p>
            <div id="infra-icons">
              <div class="infra-icon-wrapper" title="Cloudflare"><img src="assets/cloudflare.png" alt="Cloudflare"></div>
              <div class="infra-icon-wrapper" title="DNS"><img src="assets/dns.png" alt="DNS"></div>
            </div>
          </div>

          <svg id="connections-svg" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1;"></svg>
          
          <div id="stack-wrapper">
            <!-- Layers and nodes will be dynamically loaded here -->
          </div>

          <!-- Tooltip injected via JS -->
        </div>
        
      </div>

    <!-- Floating node tooltip -->
    <div id="node-tooltip" class="hidden" role="tooltip">
      <p id="tooltip-desc"></p>
    </div>
  </div>
</div>

  <script src="main.js"></script>
</body>
</html>
