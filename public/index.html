<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Infrastructure Tech Stack Visualisation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;700&family=IBM+Plex+Serif:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <!-- Visualisation wrapper that can go full screen -->
    <div id="visualisation-wrapper">
      
      <!-- Top Navbar with Title and Full Screen Action -->
      <div id="navbar" data-node-id="24:136" data-name="Navbar">
        <div id="navbar-left" data-node-id="24:138">
          <h2 id="diagram-title">Infrastructure Tech Stack</h2>
        </div>
        <button id="fullscreen-btn" aria-label="Toggle Full Screen" title="Toggle Full Screen" data-node-id="24:141">
          <div data-node-id="24:142" data-name="Full Screen">
            <img src="assets/fullscreen.png" alt="Full Screen Icon">
          </div>
        </button>
      </div>

      <!-- Tech Stack Canvas Container -->
      <div id="canvas-container">
        <!-- Central Workflow Selector -->
        <div id="workflow-selector-container">
          <div id="workflow-selector-label">Select a workflow to learn how this infra is used</div>
          <div class="custom-select-wrapper">
            <select id="workflow-select">
              <!-- Dynamically populated -->
            </select>
            <span class="custom-select-arrow"></span>
          </div>
        </div>
        
        <!-- Core Infrastructure Badge -->
        <div id="core-infra-badge">
          <span>Core infrastructure (cloudflare, DNS) providers enable all these layers</span>
          <div class="badge-icons">
            <div class="badge-icon cloudflare" title="Cloudflare">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M17.5 19A4.5 4.5 0 0 0 22 14.5c0-2-1.3-3.7-3.2-4.2A5.5 5.5 0 0 0 8.5 7a5 5 0 0 0-4 7.5A4.5 4.5 0 0 0 6.5 19z" />
              </svg>
            </div>
            <div class="badge-icon dns" title="DNS">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10" />
                <line x1="2" y1="12" x2="22" y2="12" />
                <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z" />
              </svg>
            </div>
          </div>
        </div>
        
        <!-- Scrollable stack canvas -->
        <div id="canvas">
          <svg id="connections-svg" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1;"></svg>
          <div id="stack-wrapper">
            <!-- Layers and nodes will be dynamically loaded here -->
          </div>
        </div>
        

      </div>

    </div>
  </div>

  <script src="main.js"></script>
</body>
</html>
